name: GPU Simulator

# The hosted runners have no GPU, so the Ubuntu workflow builds cuBQL but does
# not run the tests. This builds the same code with the tests enabled and runs
# them through ctest on a simulated NVIDIA H100
# (https://github.com/pantheongpu/pantheonsim). A simulator cannot reproduce
# hardware-specific behavior or timing, so it complements real-GPU testing and
# does not replace it.

on:
  workflow_dispatch:
  push:
    branches: [verify-gpu-sim]
  pull_request:
    branches: [main]
    paths:
      - "cuBQL/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cuda:
    name: CUDA 13.0 on simulated H100
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up the simulated H100 and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@68edfd58c091361dd6baf060b63de412e544d858 # v0.1.7
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      # 90-virtual embeds compute_90 PTX only, which the simulator runs. The
      # simulator needs the shared CUDA runtime (CMake's default is static).
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda-13.0/bin/nvcc \
            -DCMAKE_CUDA_ARCHITECTURES=90-virtual \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared \
            -DCUBQL_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j3

      - name: Test on the simulated H100
        run: vgpu run --gpu nvidia/h100 ctest --test-dir build -V --no-tests=error
